[package]
name = "pod-wormhole"
description = "The client of a magic-wormhole mailbox: its server protocol over a WebSocket, SPAKE2 keyed by a code of words, the sealed phases of the client protocol, and the code and its word list; the AppID and the client name are the caller's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The stand-in mailbox on the loopback (src/standin.rs): for the tests of
# this crate and of a consumer; no binary needs it.
standin = ["tokio/net", "tokio/io-util", "tokio/sync", "tokio/rt"]

[dependencies]
# The failure with its stage and class, the events, the entropy, the text
# made safe to print.
pod-core = { workspace = true, features = ["async"] }
# The WebSocket to the mailbox, through the caller's way out; the server
# half for the stand-in.
pod-ws = { workspace = true }
# The head of an upgrade, for the stand-in; the requests of HTTP/1.1 of an
# ntfy server (src/ntfy).
pod-proxy = { workspace = true }
# HTTP/2 of an ntfy server, where TLS chose it: the stream of a topic and
# the POSTs on one connection (pure Rust, as pod-ws and pod-dns take it).
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true, features = ["time"] }
serde_json = { workspace = true }
# Pure Rust, no C. SPAKE2 of the RustCrypto PAKEs, on the curve25519-dalek 4
# that magic-wormhole's Rust port interoperates with; its scalar is drawn
# from rand_core 0.6.
spake2 = { version = "0.4", default-features = false }
rand_core_06 = { package = "rand_core", version = "0.6", default-features = false }
# NaCl's SecretBox (XSalsa20 and Poly1305).
crypto_secretbox = { version = "0.1", default-features = false, features = ["alloc", "salsa20"] }
hkdf = { workspace = true }
sha2 = { workspace = true }
# Pure Rust, no C. BIP-340 Schnorr signatures over secp256k1 for the events
# of a Nostr relay (src/nostr), with a fresh key for each pairing; on the
# elliptic-curve 0.14 that p256 and p384 of the workspace take.
k256 = { version = "0.14", default-features = false, features = ["schnorr"] }
zeroize = { workspace = true }

[dev-dependencies]
pod-testkit = { workspace = true }
# The way of the tests: a direct dial and TLS on ring.
pod-tls = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
# The certificates of the stand-in ntfy server behind TLS
# (pod-tls tests/common/cert_for_test.rs), minted in pure Rust.
p256 = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# The public mailboxes of the live test.
pod-services = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "time", "sync", "rt", "rt-multi-thread", "macros", "test-util"] }

# The tests that run a mailbox on the loopback: the stand-in.
[[test]]
name = "board"
required-features = ["standin"]

[[test]]
name = "board_live"
required-features = ["standin"]

[[test]]
name = "broker"
required-features = ["standin"]

[[test]]
name = "nostr"
required-features = ["standin"]

[[test]]
name = "ntfy"
required-features = ["standin"]

[[test]]
name = "tracker"
required-features = ["standin"]

[[test]]
name = "faults"
required-features = ["standin"]

[[test]]
name = "live"
required-features = ["standin"]

[[test]]
name = "mailbox"
required-features = ["standin"]
