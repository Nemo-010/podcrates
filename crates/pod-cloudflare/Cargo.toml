[package]
name = "pod-cloudflare"
description = "The Cloudflare tunnel spoken directly: the edge client over QUIC and HTTP/2, Cap'n Proto RPC, the legs and their race, ingress, and the quick tunnels."
version.workspace = true
# The edition of the source; the next commit moves it to the workspace edition.
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The entry points of the fuzz targets (fuzz/).
fuzzing = []

[dependencies]
pod-core = { workspace = true, features = ["async"] }
pod-proxy = { workspace = true }
pod-tls = { workspace = true }
pod-dns = { workspace = true }
pod-ws = { workspace = true }
pod-quic = { workspace = true }
pod-relay = { workspace = true }
pod-warp = { workspace = true }
pod-services = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "io-util", "macros"] }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
noq = { workspace = true }
h2 = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
pod-testkit = { workspace = true }
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "rt-multi-thread", "io-util", "macros", "test-util"] }
rustls = { workspace = true, features = ["ring"] }
