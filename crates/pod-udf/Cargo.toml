[package]
name = "pod-udf"
description = "A reader of UDF (ECMA-167, UDF 1.02 to 2.60) that finds a file in an image and gives its byte ranges, with no I/O of its own: the caller reads the bytes, from a file or by HTTP Range requests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# No dependency: the reader is std only, so that a synchronous consumer and
# the lean static probe take it with no runtime.
[dependencies]

[dev-dependencies]
# The images of real tools in tests/data are kept with gzip.
flate2 = { workspace = true }
# The live test of a Windows ISO by HTTP Range requests (tests/windows_live.rs):
# the HTTP client of the workspace, its TLS on ring, the URL and the size of
# the service file, and the digests of the blocks.
pod-proxy = { workspace = true, features = ["blocking"] }
pod-tls = { workspace = true }
rustls = { workspace = true, features = ["ring"] }
pod-services = { workspace = true }
sha2 = { workspace = true }
