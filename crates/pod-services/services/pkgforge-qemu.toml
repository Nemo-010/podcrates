# The static QEMU 9.2.0 of pkgforge's bincache (the package ppkg.qemu).
# podvm's store fetches qemu-system-x86_64 and qemu-img on a host with no
# QEMU and checks the size and the sha256 of each before it uses a byte
# (PodUtils/podvm#389, its T-1875). The endpoint answers a GET with the
# file (a redirect is allowed).
id = "pkgforge-qemu"
kind = "tool"
party = "pkgforge"
about = "The static builds of QEMU 9.2.0 for x86_64 Linux in pkgforge's bincache"

[[endpoint]]
name = "qemu-system-x86-64"
scheme = "https"
host = "api.ghcr.pkgforge.dev"
port = 443
path = "/pkgforge/bincache/qemu/ppkg/qemu-system-x86_64?tag=9.2.0-x86_64-linux&download=qemu-system-x86_64"
source = { ruling = "PodUtils/podvm crates/podvm-windows/src/tools.rs PKGFORGE and bin!, at 25024cb3", read = 2026-11-15 }

[[endpoint]]
name = "qemu-img"
scheme = "https"
host = "api.ghcr.pkgforge.dev"
port = 443
path = "/pkgforge/bincache/qemu/ppkg/qemu-img?tag=9.2.0-x86_64-linux&download=qemu-img"
source = { ruling = "PodUtils/podvm crates/podvm-windows/src/tools.rs PKGFORGE and bin!, at 25024cb3", read = 2026-11-15 }

[[fact]]
name = "version"
value = "9.2.0"
source = { ruling = "PodUtils/podvm crates/podvm-windows/src/tools.rs QEMU_VERSION, at 25024cb3", read = 2026-11-15 }

[[fact]]
name = "qemu-system-x86-64-sha256"
value = "b0597850cc3aa3d473410d8da27102eddfcf3f23abbe58bd1efc7a06f197b0a1"
source = { measured = "the SHA-256 of the file at the endpoint qemu-system-x86-64", read = 2026-11-15, note = "the pin of podvm tools.rs at 25024cb3 is the same" }

[[fact]]
name = "qemu-system-x86-64-bytes"
value = 42899120
unit = "bytes"
source = { measured = "the length of the file at the endpoint qemu-system-x86-64", read = 2026-11-15, note = "the pin of podvm tools.rs at 25024cb3 is the same" }

[[fact]]
name = "qemu-img-sha256"
value = "7311a2598164b3055097f8f0484c1bbb0cd92463889fd8108c2f40fcc9f597c6"
source = { measured = "the SHA-256 of the file at the endpoint qemu-img", read = 2026-11-15, note = "the pin of podvm tools.rs at 25024cb3 is the same" }

[[fact]]
name = "qemu-img-bytes"
value = 11009488
unit = "bytes"
source = { measured = "the length of the file at the endpoint qemu-img", read = 2026-11-15, note = "the pin of podvm tools.rs at 25024cb3 is the same" }

[[watch]]
kind = "http-sha256"
endpoint = "qemu-system-x86-64"
fact = "qemu-system-x86-64-sha256"
length = "qemu-system-x86-64-bytes"

[[watch]]
kind = "http-sha256"
endpoint = "qemu-img"
fact = "qemu-img-sha256"
length = "qemu-img-bytes"
