# A public Nostr relay (relay.primal.net, strfry): a meeting point of the pairing by
# code after the mailboxes (pod-wormhole's nostr; PodUtils/podssh#235,
# PodUtils/podssh@T-545). The ends send events of one ephemeral kind with
# no account, no proof of work and no authentication; each client of the
# relay can read each event, so the ends send ciphertext alone. The
# endpoint relay is the one to dial; the facts come from its NIP-11
# document, which the watch http-json reads.
id = "primal-nostr"
kind = "nostr-relay"
party = "Primal (its public relay)"
about = "The public Nostr relay at relay.primal.net, NIP-01 over a WebSocket on port 443"

[rank]
value = 1
source = { measured = "two ends paired through the relay with events of the kind 25431 and no account, through the HTTPS proxy of a cloud session (docs/decisions.md, C548)", read = 2026-11-14 }

[[endpoint]]
name = "relay"
scheme = "wss"
host = "relay.primal.net"
port = 443
path = "/"
source = { url = "https://relay.primal.net/", read = 2026-11-14, note = "the NIP-11 document (Accept: application/nostr+json) names the software strfry and supported_nips with 1 and 11" }

[[fact]]
name = "message-bytes-most"
value = 1000000
unit = "bytes"
source = { url = "https://relay.primal.net/", read = 2026-11-14, note = "NIP-11 limitation.max_message_length; strfry also refuses an event of more than 65536 bytes of JSON (strfry.conf, maxEventSize)" }

[[fact]]
name = "subscriptions-most"
value = 20
source = { url = "https://relay.primal.net/", read = 2026-11-14, note = "NIP-11 limitation.max_subscriptions" }

[[fact]]
name = "software"
value = "git+https://github.com/hoytech/strfry.git"
source = { url = "https://relay.primal.net/", read = 2026-11-14, note = "NIP-11 software" }

[[watch]]
kind = "websocket-upgrade"
endpoint = "relay"

[[watch]]
kind = "http-json"
url = "https://relay.primal.net/"
accept = "application/nostr+json"
pointer = "/limitation"
facts = ["message-bytes-most", "subscriptions-most"]
members = ["max_message_length", "max_subscriptions"]

[[watch]]
kind = "http-json"
url = "https://relay.primal.net/"
accept = "application/nostr+json"
pointer = "/software"
fact = "software"
