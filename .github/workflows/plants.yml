name: plants

# Each check must fail on a defect planted for it (scripts/plant-each.sh,
# docs/development.md). On each push to main that changes a check, a plant
# or the record tool, and by hand.

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "crates/pod-todo/**"
      - "crates/pod-services/build.rs"
      - "crates/pod-services/src/schema.rs"
      - "crates/pod-services-watch/**"
      - "crates/pod-testkit/src/stand.rs"
      - "examples/static-probe*/**"
      - "TODO/todo.toml"
      - ".github/workflows/plants.yml"
  workflow_dispatch:

# A newer push to the same ref cancels a run that waits or runs: a queue of
# runs for old commits holds the runners that the consumers need too.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The plants run in shards: one job ran each plant in turn and passed its
# limit of 60 minutes. scripts/plant-shard.py keeps each group in one shard
# and gives each shard about the same count.
jobs:
  plants:
    name: plants (shard ${{ matrix.shard }} of 6)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: sh scripts/retry.sh rustup toolchain install
      # The plant of the convert of pod-guest runs qemu-img and qemu-io; the
      # plants of the overlay root of pod-enter run a static busybox.
      - name: qemu-utils and busybox-static
        run: |
          set -eu
          sh scripts/retry.sh sudo apt-get update
          sh scripts/retry.sh sudo apt-get install -y --no-install-recommends qemu-utils busybox-static
          qemu-img --version
      # The plants of the group turn run scripts/ci/turn-tests.sh, which
      # builds xturn with the Erlang/OTP and the Elixir of ci.yml.
      - name: Erlang/OTP 29.0.5 and Elixir 1.20.3
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.3-otp-29"
          version-type: strict
      - name: Each plant of the shard is caught
        # The ids are words with no space: the split of the shell is the list.
        run: sh scripts/plant-each.sh $(python3 -I scripts/plant-shard.py 6 ${{ matrix.shard }})
